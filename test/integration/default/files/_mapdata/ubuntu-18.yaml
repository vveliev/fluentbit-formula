# yamllint disable rule:indentation rule:line-length
# Ubuntu-18.04
---
values:
  added_in_lookup: lookup_value
  added_in_pillar: pillar_value
  arch: amd64
  config:
    config:
      pipeline:
        inputs:
          - name: cpu
            tag: my_cpu
        outputs:
          - match: my*cpu
            name: stdout
      service:
        daemon: 'Off'
        flush: 5
        http_listen: 0.0.0.0
        http_port: 2020
        http_server: 'Off'
        log_file: false
        log_level: info
    enabled: true
    file: /etc/fluentbit/fluent-bit.yaml
    name: fluentbit
  enabled: true
  group: fluentbit
  lookup:
    added_in_lookup: lookup_value
    master: template-master
    winner: lookup
  map_jinja:
    sources:
      - Y:G@osarch
      - Y:G@os_family
      - Y:G@os
      - Y:G@osfinger
      - C@fluentbit:lookup
      - C@fluentbit
      - Y:G@id
  master: template-master
  package:
    enabled: true
    name: fluent-bit
    repo:
      comments:
        - installed by saltstack-formula/fluentbit-formula
      file: /etc/apt/sources.list.d/fluentbit.list
      gpgcheck: 1
      humanname: Fluentbit Official repo
      key_url: https://packages.fluentbit.io/fluentbit.key
      name: deb https://packages.fluentbit.io/ubuntu/bionic bionic main
    use_upstream_repo: true
  rootgroup: root
  service:
    enabled: true
    log_file: agent.log
    name: fluentbit
    path: /etc/init/consul.conf
  tofs:
    files_switch:
      - any/path/can/be/used/here
      - id
      - roles
      - osfinger
      - os
      - os_family
  user: fluentbit
  version: v2.0.9
  winner: pillar
